name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (CPU-only torch to keep the runner small)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit + integration tests (no API key needed)
        run: python -m pytest -q

      - name: Retrieval eval (no API key; downloads the embedding model)
        run: python -m eval.run_eval --mode retrieval --configs dense,bm25,hybrid --name ci

      - name: Fail on retrieval regression vs committed n1_final baseline
        run: |
          python - <<'EOF'
          import json, sys
          base = json.load(open("eval/results/n1_final.json"))["configs"]["hybrid"]["overall"]
          cur = json.load(open("eval/results/ci.json"))["configs"]["hybrid"]["overall"]
          print("baseline", base, "\ncurrent ", cur)
          drop = base["recall@5"] - cur["recall@5"]
          sys.exit(1 if drop > 0.02 else 0)
          EOF
